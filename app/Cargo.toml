[package]
name = "lounge"
version = "3.0.0-alpha"
edition = "2021"
description = "Lounge — a fullscreen launcher for Windows handhelds, drawn natively with Slint."
publish = false
build = "build.rs"

[[bin]]
name = "lounge"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18.1"

[dependencies]
lounge-core = { path = "../lounge-core" }
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "unstable-winit-030"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
serde_json = "1"
base64 = "0.23"
dirs = "6"
chrono = "0.4.45"
rfd = "0.15"

[target."cfg(windows)".dependencies]
hidapi = "2.6.7"
gilrs = "0.11"
cpal = "0.18"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Power", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1"
