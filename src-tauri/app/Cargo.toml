[package]
name = "lounge-app"
version = "3.0.0-alpha"
edition = "2021"
description = "Tauri shell for Lounge. Windows-only in production (WebView2); this crate also builds on Linux (webkit2gtk) purely so it can be compiled and run for real during development on this machine."
publish = false

[lib]
name = "lounge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lounge-core = { path = "../lounge-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
hex = "0.4.3"
qrcode = { version = "0.14", features = ["svg"] }

[target."cfg(windows)".dependencies]
hidapi = "2.6.7"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Power"] }
