[package]
name = "lounge-core"
version = "0.1.0"
edition = "2021"
description = "Ported business logic from src/*.js (Electron -> Tauri migration). Platform-agnostic; no Tauri or WebView dependency lives here."
publish = false

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
fancy-regex = "0.19.2"
hex = "0.4.3"
percent-encoding = "2.3.2"
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
native-tls = "0.2.14"
ssh2 = "0.9.5"
suppaftp = { version = "6.3.0", default-features = false, features = ["native-tls"] }
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"

[lib]
name = "lounge_core"
path = "src/lib.rs"

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation"] }
