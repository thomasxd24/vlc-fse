[package]
name = "lounge-app"
version = "0.1.0"
edition = "2021"
description = "Tauri shell for Lounge. Windows-only in production (WebView2); this crate also builds on Linux (webkit2gtk) purely so it can be compiled and run for real during development on this machine."
publish = false

[lib]
name = "lounge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lounge-core = { path = "../lounge-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
