name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Renderer tests
        run: node --test test/*.test.js

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Captured so a failure's names and panics land in the run summary (readable without signing
      # in) and the full log ships as an artifact, instead of living only in the sign-in-gated log.
      - name: Rust tests (lounge-core)
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test -p lounge-core 2>&1 | tee test-output.log

      # `::error::` workflow commands become check-run annotations, which stay readable without
      # signing in (unlike step logs, step summaries and artifacts, which are all gated).
      - name: Rust test failure summary
        if: failure()
        working-directory: src-tauri
        shell: bash
        run: |
          grep -E "^test .* FAILED|panicked at|^ +lounge_core::[a-z_:0-9]+$" test-output.log | head -20 | while IFS= read -r line; do
            echo "::error::${line:0:200}"
          done
          {
            echo "### Rust test failures (last 150 lines)"
            echo '```'
            tail -150 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-log
          path: src-tauri/test-output.log
          if-no-files-found: ignore
          compression-level: 0

      - name: Clippy
        run: cargo clippy -p lounge-core -p lounge-app --all-targets -- -D warnings
        working-directory: src-tauri

      # For a release tag like v1.2.0, stamp that version into the build so file names match the tag.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          cd src-tauri
          sed -i "s|^version = \".*\"|version = \"$v\"|" app/Cargo.toml
          sed -i "s|\"version\": \".*\"|\"version\": \"$v\"|" app/tauri.conf.json

      # Produces target/release/lounge-app.exe (the app is self-contained: the renderer is embedded,
      # and WebView2's loader is statically linked), plus the NSIS bundle under
      # target/release/bundle/nsis/.
      - name: Build Windows app (Tauri)
        working-directory: src-tauri
        run: npx -y @tauri-apps/cli@2 build --bundles nsis
        env:
          # Keep the NSIS build from trying to codesign.
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Stage dist layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/app/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist, dist/win-unpacked | Out-Null
          Copy-Item src-tauri/target/release/lounge-app.exe dist/win-unpacked/Lounge.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe "dist/Lounge-Setup-$version.exe"
          $stage = Join-Path $env:RUNNER_TEMP 'lounge-zip-stage'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/win-unpacked/Lounge.exe $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "dist/Lounge-$version-win-x64.zip"
          Write-Host "version: $version"
          Get-ChildItem dist

      # Produces dist/Lounge-FSE-<version>.zip: Lounge as an MSIX that Windows offers as a
      # full screen experience home app, with its installer.
      - name: Build full screen experience package
        shell: powershell
        run: .\scripts\build-fse.ps1 -Version ((Get-Content src-tauri/app/tauri.conf.json -Raw | ConvertFrom-Json).version)

      - name: Upload FSE package
        uses: actions/upload-artifact@v4
        with:
          name: Lounge-FSE-package
          path: dist/Lounge-FSE-*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Lounge-win-x64-zip
          path: dist/Lounge-*-win-x64.zip
          if-no-files-found: error
          compression-level: 0 # already compressed

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lounge-win-x64-installer
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0

  linux:
    # Test build for Linux (Arch/Omarchy and friends). Built on 22.04 so the binary's glibc floor is old
    # enough for any current distro; at runtime it needs webkit2gtk-4.1 and gtk3 (Arch: `webkit2gtk-4.1`).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Linux app
        working-directory: src-tauri
        run: cargo build --release -p lounge-app

      - name: Package
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' src-tauri/app/tauri.conf.json | head -1)
          mkdir -p dist/stage
          cp src-tauri/target/release/lounge-app dist/stage/lounge
          tar -C dist/stage -czf "dist/Lounge-$version-linux-x64.tar.gz" lounge
          ls -la dist

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Lounge-linux-x64
          path: dist/Lounge-*-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    # Pushing a tag such as v3.0.0-alpha publishes a GitHub Release with the zip, installer and FSE
    # package attached. Pre-releases are skipped by GitHub's /releases/latest, so the app's own update
    # channel never offers them to users — an alpha is fetched deliberately, from the releases page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Hand-written notes for the tag (.github/release-notes/<tag>.md), when there are any; the app shows
      # their first lines in its "update available" prompt. GitHub's generated notes are appended.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/release-notes
            .github/foyer-bridge

      - id: notes
        run: |
          f=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Bridge for copies still running Foyer 2.0.0: its updater only looks for Foyer-named files, then needs
      # Foyer.exe inside the zip and Install-Foyer-FSE.ps1 inside the FSE package. Foyer-named copies of each
      # download make its "Update now" work; Lounge's own updater prefers the Lounge files. Drop once no
      # 2.0.0 installs are left.
      - name: Foyer-named copies for updating from Foyer 2.0.0
        run: |
          set -euo pipefail
          bridge="$PWD/.github/foyer-bridge"
          cd dist
          for f in Lounge-Setup-*.exe; do cp "$f" "Foyer-${f#Lounge-}"; done
          for f in Lounge-*-win-x64.zip; do
            case "$f" in *-win-x64.zip) ;; esac
            d=$(mktemp -d); unzip -q "$f" -d "$d"
            exe=$(find "$d" -name Lounge.exe | head -1)
            cp "$exe" "$(dirname "$exe")/Foyer.exe"
            (cd "$d" && zip -q -r -X "$OLDPWD/Foyer-${f#Lounge-}" .)
          done
          for f in Lounge-FSE-*.zip; do
            d=$(mktemp -d); unzip -q "$f" -d "$d"
            inst=$(find "$d" -name Install-Lounge-FSE.ps1 | head -1)
            cp "$bridge/Install-Foyer-FSE.ps1" "$(dirname "$inst")/"
            (cd "$d" && zip -q -r -X "$OLDPWD/Foyer-${f#Lounge-}" .)
          done
          ls -la

      # Checksums of every download, which the app's updater verifies against when GitHub's API is rate limited
      # and it finds the release through github.com instead.
      - name: Checksums
        run: cd dist && sha256sum *.zip *.exe *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
