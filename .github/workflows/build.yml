name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Real VLC, so test/vlc-real.test.js checks VLC accepts the exact command line Marquee launches it with.
      - name: Install VLC
        run: choco install vlc -y --no-progress

      - run: npm test

      # For a release tag like v1.2.0, stamp that version into the build so file names match the tag.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Produces dist/Marquee-<version>-win-x64.zip (unzip and run Marquee.exe)
      # and dist/Marquee-Setup-<version>.exe (installer).
      - name: Build Windows app
        run: npx electron-builder --win --x64 --publish never

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Marquee-win-x64-zip
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0 # already compressed

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Marquee-win-x64-installer
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0

  release:
    # Pushing a tag such as v1.0.0 publishes a GitHub Release with the zip and installer attached.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
