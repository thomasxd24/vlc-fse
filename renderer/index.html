<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Marquee</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="backdrop" aria-hidden="true">
      <div class="layer"></div>
      <div class="layer"></div>
      <div class="shade"></div>
    </div>

    <header id="topbar">
      <div class="brand"><span class="brand-mark"></span>Marquee</div>
      <nav id="tabs" data-nav-group></nav>
      <div class="topbar-right">
        <div id="status" class="status" hidden></div>
        <div id="clock" class="clock"></div>
      </div>
    </header>

    <main id="page"></main>

    <div id="now-playing" hidden></div>
    <div id="modal-root"></div>
    <div id="toasts" aria-live="polite"></div>

    <script src="nav.js"></script>
    <script src="app.js"></script>
  </body>
</html>
