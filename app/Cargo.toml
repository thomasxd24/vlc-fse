[package]
name = "lounge"
version = "3.0.0-alpha"
edition = "2021"
description = "Lounge — a fullscreen launcher for Windows handhelds, drawn natively with Slint."
publish = false
build = "build.rs"

[[bin]]
name = "lounge"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18.1"

[dependencies]
lounge-core = { path = "../lounge-core" }
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
hex = "0.4.3"
dirs = "6"
rfd = "0.15"
gilrs = "0.11"

[target."cfg(windows)".dependencies]
hidapi = "2.6.7"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Power", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"
