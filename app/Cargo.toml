[package]
name = "lounge"
version = "3.0.0-alpha"
edition = "2021"
description = "Lounge — a fullscreen launcher for Windows handhelds, drawn natively with Slint."
publish = false
build = "build.rs"

[[bin]]
name = "lounge"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18.1"

[dependencies]
lounge-core = { path = "../lounge-core" }
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "unstable-winit-030"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
serde_json = "1"
base64 = "0.23"
dirs = "6"
chrono = "0.4.45"
rfd = "0.15"

[target."cfg(windows)".dependencies]
hidapi = "2.6.7"
cpal = "0.18"
# Bluetooth panel: audio endpoints, Bluetooth headset connect / disconnect, AirPods broadcasts (COM and
# WinRT, which windows-sys doesn't cover). Same version cpal already pulls in.
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties", "Devices_Bluetooth_Advertisement", "Foundation_Collections", "Storage_Streams"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Power", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_XboxController", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1"
